name: Build Docker Image

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - clamp-base.Dockerfile
          - clamp-claude.Dockerfile
          - clamp-opencode.Dockerfile
          - clamp-pi.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  build:
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint shell scripts
        run: shopt -s globstar && shellcheck **/*.sh

      - name: Build images
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build -f clamp-base.Dockerfile -t clamp-base .
          docker build -f clamp-claude.Dockerfile -t clamp-claude .
          docker build -f clamp-opencode.Dockerfile -t clamp-opencode .
          docker build -f clamp-pi.Dockerfile -t clamp-pi .
