[tools]
go = "1.27.3"
golangci-lint = ["2.15.0"]
shellcheck = ["0.11.0"]

[tasks.build]
description = "Build both Go tools"
depends = ["build:mitm-proxy", "build:console"]

[tasks."build:console"]
description = "Build the Clamp console executable"
dir = "{{config_root}}/console"
run = "go build -o ../bin/clamp ./cmd/clamp"

[tasks."build:mitm-proxy"]
description = "Build the Clamp MITM proxy executable"
dir = "{{config_root}}/mitm-proxy"
run = "go build -o ../bin/clamp-mitm-proxy ./cmd/clamp-mitm-proxy"

[tasks.check]
description = "Check both Go tools and the shell scripts"
depends = ["check:mitm-proxy", "check:console"]
dir = "{{config_root}}"
run = "./dev-scripts/check-shellcheck.sh"

[tasks."check:console"]
description = "Format, vet, lint, and test the console"
dir = "{{config_root}}/console"
run = [
    "go fmt ./...",
    "go vet ./...",
    "golangci-lint run",
    "go test ./...",
]

[tasks."check:mitm-proxy"]
description = "Format, vet, lint, and test the proxy"
dir = "{{config_root}}/mitm-proxy"
run = [
    "go fmt ./...",
    "go vet ./...",
    "golangci-lint run",
    "go test ./...",
]