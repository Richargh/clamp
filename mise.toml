[tools]
go = "1.27.3"
golangci-lint = ["2.15.0"]
shellcheck = ["0.11.0"]

[tasks.check]
description = "Format, vet, lint, and test the proxy and shell scripts"
dir = "{{config_root}}/mitm-proxy"
run = [
    "go fmt ./...",
    "go vet ./...",
    "golangci-lint run",
    "go test ./...",
    "../dev-scripts/check-shellcheck.sh",
]